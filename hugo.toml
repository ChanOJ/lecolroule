# Hugo configuration of https://www.lecolroule.fr
#
# One page per URL and per language: content/<page>.<lang>.md, published at
# /<lang>/<slug>/ (slug set in each page's front matter).

baseURL = "https://www.lecolroule.fr/"
title = "Le Col Roulé"
publishDir = "dist"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = true

disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

# Page lastmod (sitemap) from the last git commit touching the page.
enableGitInfo = true

[markup.goldmark.renderer]
  # Allows the occasional raw HTML in content (e.g. <br>).
  unsafe = true

[markup.goldmark.extensions.typographer]
  # Keep straight quotes and apostrophes as typed.
  disable = true

[markup.goldmark.parser]
  # Standalone images are rendered by layouts/_markup/render-image.html,
  # not wrapped in a paragraph.
  wrapStandAloneImageWithinParagraph = false

[params]
  # Google Analytics: disabled (it sets cookies, so it would need a consent
  # banner under EU law). Uncomment to put it back on every page; the prod
  # Content-Security-Policy still allows it (infra module option "analytics").
  # googleAnalyticsID = "G-2MX2EV8ZZE"
  twitter = "@LeColRoule"
  # Default share image, also published as /cover.jpg (layouts/home.html).
  ogImage = "/images/vue_ete3.jpg"
  copyrightYears = "2021-2026"

  # The holiday rental, for structured data (schema.org JSON-LD, see
  # layouts/_partials/structured-data.html).
  [params.lodging]
    name = "Le Col Roulé"
    email = "contact@lecolroule.fr"
    streetAddress = "Route de l'Archaz"
    postalCode = "73450"
    locality = "Valloire"
    region = "Savoie"
    country = "FR"
    latitude = 45.1631353
    longitude = 6.4344565
    map = "https://maps.app.goo.gl/ng9N1mwDaAWFdeH87"
    stars = 3
    occupancy = 8
    bedrooms = 3
    floorSizeM2 = 63
    yearBuilt = 2010
    petsAllowed = true
    smokingAllowed = false
    # Listings of the rental (schema.org sameAs, with the Airbnb page of the
    # language and the social links).
    profiles = [
      "https://maps.app.goo.gl/LcE7D1GPghGa8nBMA",  # Google Business Profile
      "https://maps.apple/p/N-qZ7Ut20C~wpH",        # Apple Business Connect
    ]
    # Amenities (schema.org amenityFeature): present (true) or not (false).
    # An array, not a table: Hugo lowercases table keys.
    amenities = [
      { name = "Wifi (fibre)", value = true },
      { name = "Free private parking (2 spaces)", value = true },
      { name = "Electric vehicle charging station (7 kW)", value = true },
      { name = "Fully equipped kitchen", value = true },
      { name = "Dishwasher", value = true },
      { name = "Washing machine", value = true },
      { name = "Television", value = true },
      { name = "Covered terrace (20 m²)", value = true },
      { name = "Mountain view", value = true },
      { name = "Ski locker", value = true },
      { name = "Glove dryer", value = true },
      { name = "Baby cot", value = true },
      { name = "Elevator", value = false },
    ]

  # Social links: footer and booking page.
  [[params.social]]
    name = "linkedin"
    url = "https://www.linkedin.com/company/le-col-roulé-valloire"
    icon = "linkedin-in"
    style = "brands"
  [[params.social]]
    name = "youtube"
    url = "https://www.youtube.com/channel/UCOglkzCFo1V95EHQb4eHKHg"
    icon = "youtube"
    style = "brands"
  # Map link: Google Maps, replaced on Apple devices by the Apple Maps listing
  # (appleUrl, see main.js "Maps links").
  [[params.social]]
    name = "google maps"
    url = "https://maps.app.goo.gl/ng9N1mwDaAWFdeH87"
    appleUrl = "https://maps.apple/p/N-qZ7Ut20C~wpH"
    icon = "map-marked-alt"
    style = "solid"

[languages]
  [languages.fr]
    weight = 1
    label = "Français"
    locale = "fr-FR"
    [languages.fr.params]
      flag = "/images/fr.svg"
      # Booking page; used by links and buttons written "airbnb:" in content.
      airbnb = "https://www.airbnb.fr/rooms/48075207"
      ogLocale = "fr_FR"
      # Newsletter: Brevo form, embedded as an iframe (its own page, with its
      # Cloudflare Turnstile captcha). NL/DE/IT: the English form for now.
      brevoForm = "https://c9a5d88e.sibforms.com/v2/serve/MUIFAPq_UEzIEbBV6xJvh6_2WU2I9fVKvP_yzNN_008vCH74nIM_Jlh8Tv6ZUuCpLwKuqpUuE0ej5yIDHAPGO3Ltv8UIY9_N0XwYp8VHzbcsTljm2M6RmDRhSkpYr0DvN7kF-uxtPZBqu6148-fYZ5DgLvMi-_nfjJsk5CJMKg4cwd5L_NiaCgF03nRVk39iWl7xYzgJ4U3nlDEc"

  [languages.en]
    weight = 2
    label = "English"
    locale = "en-GB"
    [languages.en.params]
      flag = "/images/uk.svg"
      airbnb = "https://www.airbnb.com/rooms/48075207"
      ogLocale = "en_GB"
      brevoForm = "https://c9a5d88e.sibforms.com/v2/serve/MUIFAMRl0U4gTT9XYnv_YPxTm2KonMfz4nCYChc4B3gxXirLmHJJmY0thDUOeiVcypnrXHmJG6UKBP67DMsgjn5fbyEBTwagOjUG_0TrG2H1sHLgNsVS__XdogO9EA2Bjx32FH0i_bYNyNbsOH8N6Gfz8cq-ibiZFlN_bwLrZgJ3OxpVvBbDJKpAxrf4uuv-gF8sWAaG3Qff6ReE"

  # NL, DE and IT: Dutch also for Flanders, German in Swiss spelling (ss, no
  # sharp s) also for Switzerland; hreflang uses the plain language codes, so
