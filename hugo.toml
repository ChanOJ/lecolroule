  [languages.de]
    weight = 4
    label = "Deutsch"
    locale = "de-CH"
    [languages.de.params]
      flag = "/images/de.svg"
      airbnb = "https://www.airbnb.de/rooms/48075207"
      ogLocale = "de_CH"
      brevoForm = "https://c9a5d88e.sibforms.com/v2/serve/MUIFAMRl0U4gTT9XYnv_YPxTm2KonMfz4nCYChc4B3gxXirLmHJJmY0thDUOeiVcypnrXHmJG6UKBP67DMsgjn5fbyEBTwagOjUG_0TrG2H1sHLgNsVS__XdogO9EA2Bjx32FH0i_bYNyNbsOH8N6Gfz8cq-ibiZFlN_bwLrZgJ3OxpVvBbDJKpAxrf4uuv-gF8sWAaG3Qff6ReE"

