# Hugo configuration of https://www.lecolroule.fr
#
# One page per URL and per language: content/<page>.<lang>.md, published at
# /<lang>/<slug>/ (slug set in each page's front matter).

baseURL = "https://www.lecolroule.fr/"
title = "Le Col Roulé"
publishDir = "dist"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = true

disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

# Page lastmod (sitemap) from the last git commit touching the page.
enableGitInfo = true

[markup.goldmark.renderer]
  # Allows the occasional raw HTML in content (e.g. <br>).
  unsafe = true

[markup.goldmark.extensions.typographer]
  # Keep straight quotes and apostrophes as typed.
  disable = true

[markup.goldmark.parser]
  # Standalone images are rendered by layouts/_markup/render-image.html,
  # not wrapped in a paragraph.
  wrapStandAloneImageWithinParagraph = false

[params]
  googleAnalyticsID = "G-2MX2EV8ZZE"
  mouseflowProject = "302dacdc-9d9f-47b0-8ae5-d8c5842c6361"
  recaptchaSiteKey = "6LflesIqAAAAAOjZvfGc0s_DN1VHLHQSiG2ePmSi"
  twitter = "@LeColRoule"
  ogImage = "/images/vue_ete3.jpg"
  copyrightYears = "2021-2026"

  # The holiday rental, for structured data (schema.org JSON-LD, see
  # layouts/_partials/structured-data.html).
  [params.lodging]
    name = "Le Col Roulé"
    email = "contact@lecolroule.fr"
    streetAddress = "Route de l'Archaz"
    postalCode = "73450"
    locality = "Valloire"
    region = "Savoie"
    country = "FR"
    latitude = 45.1631353
    longitude = 6.4344565
    map = "https://maps.app.goo.gl/ng9N1mwDaAWFdeH87"
    stars = 3
    occupancy = 8
    bedrooms = 3
    floorSizeM2 = 63
    yearBuilt = 2010
    petsAllowed = true
    smokingAllowed = false

  # Social links: footer and booking page.
  [[params.social]]
    name = "linkedin"
    url = "https://www.linkedin.com/company/le-col-roulé-valloire"
    icon = "linkedin-in"
    style = "brands"
  [[params.social]]
    name = "youtube"
    url = "https://www.youtube.com/channel/UCOglkzCFo1V95EHQb4eHKHg"
    icon = "youtube"
    style = "brands"
  [[params.social]]
    name = "google maps"
    url = "https://maps.app.goo.gl/ng9N1mwDaAWFdeH87"
    icon = "map-marked-alt"
    style = "solid"

[languages]
  [languages.fr]
    weight = 1
    label = "Français"
    locale = "fr-FR"
    [languages.fr.params]
      flag = "/images/fr.svg"
      # Booking page; used by links and buttons written "airbnb:" in content.
      airbnb = "https://www.airbnb.fr/rooms/48075207"
      ogLocale = "fr_FR"
      brevoFormAction = "https://c9a5d88e.sibforms.com/serve/MUIFAKFA-m-7SD2GvTdZ_cN1O6lGrKAhBM27iGXAq0_J_OeNBrmoCmaFG3yJI3yNmwbFDy42WJgbczqOzgMMi77KVt4sEPSD_y0B_63vE6LRIcJCsGQXUwjgD5XSNTPc2v-QhriIu3eI_mHBGOxZ8SV45kHFaCh6TqRUPQGj5IL24o8YSI5aFc9pyxEpKP41m9VEeVNCN7VzTdTi"

  [languages.en]
