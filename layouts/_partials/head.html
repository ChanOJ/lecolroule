<!-- Meta -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Dark page: browsers must not apply their own dark mode (it recolours images such as the flags). -->
		<meta name="color-scheme" content="dark" />
		<title>{{ partial "title.html" . }}</title>
		<meta name="description" content="{{ .Description }}" />
		<link rel="canonical" href="{{ .Permalink }}" />
		{{- range .AllTranslations }}
		<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}" />
		{{- end }}
		{{- range first 1 (where .AllTranslations "Language.Lang" "en") }}
		<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}" />
		{{- end }}

		<meta property="og:locale" content="{{ site.Language.Params.ogLocale }}" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="{{ partial "title.html" . }}" />
		<meta property="og:description" content="{{ .Description }}" />
		<meta property="og:url" content="{{ .Permalink }}" />
		<meta property="og:image" content="{{ partial "asset-url.html" (or .Params.ogImage site.Params.ogImage) | absURL }}" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="{{ site.Params.twitter }}" />
		<meta name="twitter:image:alt" content="{{ site.Title }} - Valloire" />


		<!-- Styles; fonts and background fetched at once rather than once the stylesheets are parsed -->
		<link rel="preload" href="/webfonts/source-sans-pro-5.3.0-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/webfonts/source-sans-pro-5.3.0-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="{{ partial "asset-url.html" "/images/bg.jpg" }}" as="image" />
		{{- partial "styles.html" . }}
		{{- partial "favicon.html" . }}
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.googleAnalyticsID }}"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', '{{ site.Params.googleAnalyticsID }}');

			gtag('event', 'page_view', {
				page_path: location.pathname
			});
		</script>
		{{- partial "structured-data.html" . }}
