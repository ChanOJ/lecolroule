<html lang="{{ site.Language.Lang }}">
	<head>
		{{- partial "head.html" . }}
		{{- block "head" . }}{{ end }}
	</head>
	<body class="is-preload" data-home="{{ site.Home.RelPermalink }}" data-home-title="{{ partial "title.html" site.Home }}">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- TopBar: links to this page in the other languages -->
					<div id="topbar">
						{{- range .Translations }}
						<span class="image lang"><a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}" rel="alternate"><img class="lozad" data-src="{{ .Language.Params.flag }}" alt="{{ .Language.Label }}" /></a></span>
						{{- end }}
					</div>

				{{- partial "header.html" . }}

				<!-- Main -->
					<div id="main">
						{{- block "main" . }}{{ end }}
					</div>

				{{- partial "footer.html" . }}

			</div>

		<!-- BG -->
			<div id="bg"></div>

		<!-- Scripts -->
			<script src="/assets/js/lozad.min.js"></script>
			<script src="/assets/js/jquery.min.js"></script>
			<script src="/assets/js/browser.min.js"></script>
			<script src="/assets/js/breakpoints.min.js"></script>
			<script src="/assets/js/util.js"></script>
			<script src="/assets/js/main.js"></script>
			{{- block "scripts" . }}{{ end }}

	</body>
</html>
