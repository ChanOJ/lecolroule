<html lang="{{ site.Language.Lang }}">
	<head>
		{{- partial "head.html" . }}
		{{- block "head" . }}{{ end }}
	</head>
	<body class="is-preload" data-home="{{ site.Home.RelPermalink }}" data-home-title="{{ partial "title.html" site.Home }}">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- TopBar: language menu -->
					<div id="topbar">
						{{ partial "language-menu.html" . }}
					</div>

				{{- partial "header.html" . }}

				<!-- Main -->
					<div id="main">
						{{- block "main" . }}{{ end }}
					</div>

				{{- partial "footer.html" . }}

			</div>

		<!-- BG -->
			<div id="bg"></div>

		<!-- Scripts -->
			{{- partial "scripts.html" . }}
			{{- block "scripts" . }}{{ end }}

	</body>
</html>
