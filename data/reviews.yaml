    lang: nl
    text: "Wij verbleven 3 nachten in het mooie appartement van Charles en Hélène, en hadden er een fantastische tijd. Het appartement is zeer ruim en bijzonder goed uitgerust, ook gezellig ingericht. Er is voldoende bergruimte. Wij hielden heel heel erg van het grote terras…"
    translations:
      fr: "Nous avons séjourné 3 nuits dans le bel appartement de Charles et Hélène, et y avons passé un moment fantastique. L'appartement est très spacieux et particulièrement bien équipé, et aussi décoré avec chaleur. Il y a assez de rangements. Nous avons vraiment, vraiment adoré la grande terrasse…"
      en: "We stayed 3 nights in Charles and Hélène's lovely flat and had a fantastic time. The flat is very spacious and particularly well equipped, and cosily furnished too. There is plenty of storage space. We really, really loved the large terrace…"
      de: "Wir haben 3 Nächte in der schönen Wohnung von Charles und Hélène verbracht und eine fantastische Zeit gehabt. Die Wohnung ist sehr geräumig und besonders gut ausgestattet, auch gemütlich eingerichtet. Es gibt genügend Stauraum. Die grosse Terrasse hat uns ganz, ganz besonders gefallen…"
      it: "Abbiamo soggiornato 3 notti nel bell'appartamento di Charles e Hélène e abbiamo passato dei momenti fantastici. L'appartamento è molto spazioso e particolarmente ben attrezzato, anche arredato in modo accogliente. C'è abbastanza spazio per riporre le cose. Abbiamo amato davvero tantissimo la grande terrazza…"
