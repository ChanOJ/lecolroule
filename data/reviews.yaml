  - name: Elsie
    date: 2026-08-22
    stars: 5
    lang: fr
    text: "Nous avons passé 3 magnifiques semaines au Col Roulé, l'appartement d'Hélène et Charles. L'été à Valloire, on ne s'ennuie pas ! Randonnées multiples , piscine , patinoire, du kart dans la montagne, du ruisseling, des restaurants excellents et même un ciné ! Bref des vacances de…"
    translations:
      en: "We spent 3 wonderful weeks at Le Col Roulé, Hélène and Charles's flat. Summer in Valloire is never boring! Lots of hikes, swimming pool, ice rink, karting in the mountains, river trekking, excellent restaurants and even a cinema! In short, a holiday…"
      nl: "We hebben 3 prachtige weken doorgebracht in Le Col Roulé, het appartement van Hélène en Charles. In de zomer verveel je je nooit in Valloire! Talloze wandelingen, zwembad, schaatsbaan, karten in de bergen, riviertrekking, uitstekende restaurants en zelfs een bioscoop! Kortom, een vakantie…"
      de: "Wir haben 3 wunderbare Wochen im Col Roulé verbracht, der Wohnung von Hélène und Charles. Im Sommer wird es in Valloire nie langweilig! Viele Wanderungen, Schwimmbad, Eisbahn, Kartfahren in den Bergen, Bachwandern, ausgezeichnete Restaurants und sogar ein Kino! Kurz gesagt, Ferien…"
      it: "Abbiamo trascorso 3 splendide settimane al Col Roulé, l'appartamento di Hélène e Charles. D'estate a Valloire non ci si annoia mai! Tante escursioni, piscina, pista di pattinaggio, kart in montagna, torrentismo, ottimi ristoranti e persino un cinema! Insomma, una vacanza…"
